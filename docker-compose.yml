version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: campaign_monitor_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: campaign
      POSTGRES_PASSWORD: campaign
      POSTGRES_DB: campaign_monitor
    volumes:
      - campaign_monitor_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaign -d campaign_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campaign_monitor_pg:
